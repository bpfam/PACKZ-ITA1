<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPFAM — Area Riservata 💎</title>

<style>
:root{
  --accent:#00e0c7;
  --text:#eaf3ff;
  --muted:#9aa3b2;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,system-ui;
  background:radial-gradient(circle at top,#0b1220,#000);
  color:var(--text);
  padding:30px 16px;
}
.wrap{max-width:900px;margin:auto}
.card{
  background:#0e131a;
  border-radius:20px;
  padding:20px;
  border:1px solid #ffffff14;
  box-shadow:0 10px 40px #000;
}
h1{text-align:center;color:var(--accent)}
.subtitle{text-align:center;color:var(--muted);margin-bottom:10px}
.field{
  width:100%;padding:12px;margin:6px 0;
  border-radius:12px;border:1px solid #ffffff20;
  background:#000;color:white;
}
.btn{
  width:100%;padding:12px;border-radius:12px;
  border:0;font-weight:800;cursor:pointer;
  background:white;color:black;
}
.msg{margin-top:10px;color:var(--muted);font-size:14px}

.topbar{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:12px;
}
.logout{
  background:white;color:black;border:0;
  padding:8px 12px;border-radius:10px;
  font-weight:800;cursor:pointer;
}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{
  padding:8px 12px;border-radius:999px;
  background:#ffffff15;border:1px solid #ffffff20;
  cursor:pointer;font-weight:700;
}
.tab.active{
  background:#00e0c720;color:var(--accent);
  border-color:#00e0c7;
}

.list{display:grid;gap:10px}
.item{
  display:flex;justify-content:space-between;
  align-items:center;background:#00000040;
  border:1px solid #ffffff12;padding:12px;
  border-radius:12px;
}
a.link{color:var(--accent);text-decoration:none;font-weight:700}
.hide{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<h1>💎 AREA RISERVATA</h1>
<p class="subtitle" id="sub">Accesso consentito solo agli autorizzati</p>

<!-- LOGIN -->
<div id="loginView">
  <input id="email" class="field" type="email" placeholder="Email">
  <input id="pass" class="field" type="password" placeholder="Password">
  <button id="loginBtn" class="btn">Entra</button>
  <div class="msg" id="msg"></div>
  <footer>Se non hai accesso contatta l’amministratore</footer>
</div>

<!-- DASHBOARD -->
<div id="dashView" class="hide">

  <div class="topbar">
    <div id="who"></div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-t="contacts">Contatti</div>
    <div class="tab" data-t="media">Media</div>
  </div>

  <!-- CONTATTI -->
  <div id="contactsTab" class="list">
    <div class="item">
      <span>Instagram</span>
      <a class="link" target="_blank" href="https://instagram.com/">Apri</a>
    </div>
    <div class="item">
      <span>Telegram</span>
      <a class="link" target="_blank" href="https://t.me/">Apri</a>
    </div>
  </div>

  <!-- MEDIA -->
  <div id="mediaTab" class="list hide">

    <div class="item">
      <span>🎬 Video</span>
      <a class="link" href="/PACKZ-ITA1/videos/">Apri</a>
    </div>

    <div class="item">
      <span>✨ Vetrina</span>
      <a class="link" href="/PACKZ-ITA1/vetrina.html">Apri</a>
    </div>

  </div>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://qnbouentjmyhyujsgwej.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AchUs72cypEmbEj3pWAHnA_zYXjSu17";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView=document.getElementById("loginView");
const dashView=document.getElementById("dashView");
const msg=(t)=>document.getElementById("msg").innerText=t;
const who=document.getElementById("who");
const sub=document.getElementById("sub");

function showDash(email){
  loginView.classList.add("hide");
  dashView.classList.remove("hide");
  who.innerText="Loggato come: "+email;
  sub.classList.add("hide");
}
function showLogin(){
  dashView.classList.add("hide");
  loginView.classList.remove("hide");
  sub.classList.remove("hide");
}

async function guard(){
  const { data } = await sb.auth.getSession();
  if(data.session) showDash(data.session.user.email);
}
guard();

loginBtn.onclick = async ()=>{
  msg("Accesso...");
  const { data, error } = await sb.auth.signInWithPassword({
    email: email.value,
    password: pass.value
  });
  if(error) return msg("❌ "+error.message);
  showDash(data.user.email);
};

logoutBtn.onclick = async ()=>{
  await sb.auth.signOut();
  showLogin();
};

// tabs
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(a=>a.classList.remove("active"));
    t.classList.add("active");
    if(t.dataset.t==="contacts"){
      contactsTab.classList.remove("hide");
      mediaTab.classList.add("hide");
    }else{
      mediaTab.classList.remove("hide");
      contactsTab.classList.add("hide");
    }
  }
});
</script>

</body>
</html>
